# The product's CI jobs, called by the gate. A product file: the first goal adds the
# product's build, tests and harness here, on the platforms the requirements name.
name: product

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # S1's done-check (spec/acceptance.md, S1-1 to S1-5): README.md stays true.
  readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The README checks' own tests
        run: python3 -I -m unittest discover -s .github/scripts -t .github/scripts
      - name: README checks (S1-1 to S1-5)
        run: python3 -I .github/scripts/check_readme.py --root .
