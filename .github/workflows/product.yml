# The product's CI jobs, called by the gate. A product file: G1 adds the product's build,
# tests and harness here, on the platforms the requirements name.
name: product

on:
  workflow_call:
    secrets:
      HF_TOKEN:
        description: The Owner's Hugging Face read token, for gated models such as pyannote's (#96). Read it only in steps that download models.
        required: false

permissions:
  contents: read

jobs:
  # The tier filter (design/architecture.md "CI"): the tiers this change runs, by the paths it
  # touches. Every tier when the change can't be computed, and on workflow_dispatch and schedule.
  # A job skipped by its tier passes.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tier
        env:
          # In a called workflow, the gate's event.
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 -I .github/scripts/tiers.py --event "$EVENT" --base "$BASE" --head "$HEAD"

  # S1's done-check (spec/acceptance.md, S1-1 to S1-5): README.md stays true.
  # Tier 0 runs the checks that need no install; tier 1 and up run them all.
  readme:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The README checks' own tests
        run: python3 -I -m unittest discover -s .github/scripts -t .github/scripts
      - name: README checks that need no install (S1-1, S1-2's heading, S1-5)
        if: fromJSON(needs.changes.outputs.tier) < 1
        env:
          LMT_TIER: ${{ needs.changes.outputs.tier }}
        run: python3 -I .github/scripts/check_readme.py --root . --no-install --criteria-out criteria-readme.json
      # S1-3's Build block runs uv, at toolchain.toml's version (tests/test_toolchain.py).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: fromJSON(needs.changes.outputs.tier) >= 1
        with:
          version: "0.13.6"
          enable-cache: true
      - name: README checks (S1-1 to S1-5)
        if: fromJSON(needs.changes.outputs.tier) >= 1
        env:
          LMT_TIER: ${{ needs.changes.outputs.tier }}
        run: python3 -I .github/scripts/check_readme.py --root . --criteria-out criteria-readme.json
      # G1-14: the results table equals what results/full.json renders (design/internal/g1-stage1.md §6).
      - if: fromJSON(needs.changes.outputs.tier) >= 1
        run: uv sync --locked
      - name: The results table's drift check (G1-14)
        if: fromJSON(needs.changes.outputs.tier) >= 1
        run: uv run --frozen lmt eval --check-readme
      # The job's per-criterion record (design/internal/criteria.md §3); a cancelled run uploads none.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criteria-readme
          path: criteria-readme.json
          retention-days: 90
          if-no-files-found: error

  # The product's tests that need no model or data, and ruff (design/internal/g1-stage1.md §1a).
  test:
    needs: changes
    if: fromJSON(needs.changes.outputs.tier) >= 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The full history: G3-7's install fetches the tag from this checkout, and a shallow one lacks the parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      # PortAudio for sounddevice, which Linux's wheel doesn't bundle (G2-5; design/internal/g2-stage1.md §4).
      - name: PortAudio (libportaudio2)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2
      - run: uv sync --locked --all-extras
      # G1-15: every distribution and bundled library on both platforms against toolchain.toml's [licences].
      - name: Licences (linux-x86_64)
        run: python3 -I .github/scripts/check_licences.py --site .venv/lib/python3.11/site-packages --platform linux-x86_64
      # The lock's macOS wheels, unpacked here without running them. The export names no index, so macOS's
      # torch comes from PyPI. No --no-build: docopt and srt are sdist-only (pure Python).
      - name: Licences (macos-arm64)
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"   # av's macOS wheels are macosx_14_0 only; uv otherwise assumes an older macOS
        run: |
          uv export --frozen --all-extras --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv pip install --no-deps --require-hashes --target "$RUNNER_TEMP/macos" --python-platform aarch64-apple-darwin \
            --python-version 3.11 -r "$RUNNER_TEMP/requirements.txt"
          python3 -I .github/scripts/check_licences.py --site "$RUNNER_TEMP/macos" --platform macos-arm64
      - run: uv run --frozen ruff check
      # `=`: before tests/conftest.py adds the option, pytest would take a separate PATH for a test path.
      - env:
          LMT_TIER: ${{ needs.changes.outputs.tier }}
        run: uv run --frozen pytest --criteria-out=criteria-test-1.json
      # The Mac's figures in results/full.json against the spec's bounds (G1-8, G1-9, G1-10's memory, G1-12's
      # Mac half, G1-14's figures; design/internal/criteria.md §2). A missed bound is recorded, never a failure:
      # it exits non-zero only for a malformed file. It runs after a failed pytest too.
      - name: The Mac's figures (results/full.json)
        if: ${{ !cancelled() }}
        env:
          LMT_TIER: ${{ needs.changes.outputs.tier }}
        run: python3 -I .github/scripts/check_results.py --results results/full.json --criteria-out criteria-test-2.json
      # G3-7 on Linux (design/internal/g3-stage1.md §4a): the README's install, from this checkout, into a
      # clean scratch. It runs after a failed pytest too, so its checks stay in the record.
      - name: The one-command install (G3-7, Linux)
        if: ${{ !cancelled() }}
        env:
          LMT_TIER: ${{ needs.changes.outputs.tier }}
        run: python3 -I .github/scripts/check_install.py --platform linux-x86_64 --scratch "$RUNNER_TEMP/install" --readme . --tag-checkout --criteria-out criteria-test-3.json
      # The job's per-criterion record, one file per program (design/internal/criteria.md §3); a cancelled
      # run uploads none.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criteria-test
          path: criteria-test-*.json
          retention-days: 90
          if-no-files-found: error

  # The tests that run the models (design/internal/g1-stage1.md §3): the pinned model files, cached by the
  # manifest's hash, downloaded on a miss and verified on every run.
  test-models:
    needs: changes
    if: fromJSON(needs.changes.outputs.tier) >= 2
    runs-on: ubuntu-24.04
    # 60, not 30: G2's live model tests run the pipeline in lockstep (~20 min each for 1e and 3a4 on a runner).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: models
        with:
          path: ~/.cache/lmt/models
          key: models-${{ hashFiles('src/lmt/models.toml') }}
      - name: Download the default models
        if: steps.models.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # this step only (#96)
        run: uv run --frozen lmt models download
      - run: uv run --frozen lmt models verify
      # G1-4's re-encode check (design/internal/g1-stage2.md, P6b). The ffmpeg CLI is only CI's checking tool,
      # never shipped, so G1-15's inventory doesn't change.
      - name: The ffmpeg CLI (G1-4)
        run: |
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }
          ffmpeg -version | head -n 1
      # `=`: before tests/conftest.py adds the option, pytest would take a separate PATH for a test path.
      - env:
          LMT_TIER: ${{ needs.changes.outputs.tier }}
          LMT_FIXTURE_OUT: ${{ runner.temp }}/fixture
        run: uv run --frozen pytest -m models --criteria-out=criteria-test-models.json
      # The run's JSON when it differs from the transcript fixture in a machine-independent field
      # (design/internal/g3-stage1.md, 0d), for the builder to commit unchanged. Before the record's upload, which
      # stays the job's last step.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcript-fixture
          path: ${{ runner.temp }}/fixture
          if-no-files-found: ignore
      # The job's per-criterion record (design/internal/criteria.md §3); a cancelled run uploads none.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criteria-test-models
          path: criteria-test-models.json
          retention-days: 90
          if-no-files-found: error

  # The browser tests (G3-5, G3-2's Chrome parse) on the runner's headless Chrome and its matching
  # chromedriver (CHROMEWEBDRIVER); nothing is downloaded (#83, 8a). Then the page's screenshot, and the record.
  browser:
    needs: changes
    if: fromJSON(needs.changes.outputs.tier) >= 2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SE_OFFLINE: "true"
      SE_AVOID_STATS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: google-chrome --version && "$CHROMEWEBDRIVER/chromedriver" --version
      - env:
          LMT_TIER: ${{ needs.changes.outputs.tier }}
        run: uv run --frozen pytest -m browser --criteria-out=criteria-browser.json
      # The page's screenshot, for the Reviewer (design/internal/g3-stage1.md §3, 3d).
      - run: uv run --frozen python tests/browser/screenshot.py --transcript tests/fixtures/two_speakers.transcript.json --out "$RUNNER_TEMP/demo.png"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-screenshot
          path: ${{ runner.temp }}/demo.png
      # The job's per-criterion record (design/internal/criteria.md §3); a cancelled run uploads none.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criteria-browser
          path: criteria-browser.json
          retention-days: 90
          if-no-files-found: error

  # The CI subset, cached by the manifests' hash, fetched and verified on every run (design/internal/g1-stage1.md
  # §5a), and `lmt eval --set ci` run twice on it: G1-5's comparison and G1-8c's bounds
  # (design/internal/g1-stage2.md, P2b).
  eval-ci:
    needs: changes
    if: fromJSON(needs.changes.outputs.tier) >= 3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lmt/data
          key: data-${{ hashFiles('src/lmt/eval/manifests/*.toml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: models
        with:
          path: ~/.cache/lmt/models
          key: models-${{ hashFiles('src/lmt/models.toml') }}
      - name: Download the default models
        if: steps.models.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # this step only (#96)
        run: uv run --frozen lmt models download
      - run: uv run --frozen lmt models verify
      # G1-5: the first run fetches the subset on a cache miss; each writes results/ci.json.
      - name: The harness on the CI subset, first run
        run: uv run --frozen lmt eval --set ci
      - run: cp results/ci.json "$RUNNER_TEMP/ci-1.json"
      # report's `dirty` excludes results/, so the first file doesn't dirty the second run's tree.
      - name: The harness on the CI subset, second run
        run: uv run --frozen lmt eval --set ci
      # `=`: before tests/conftest.py adds the option, pytest would take a separate PATH for a test path.
      # tests/test_eval_ci.py reads both runs' files (G1-5, G1-8c, G1-12).
      - env:
          LMT_TIER: ${{ needs.changes.outputs.tier }}
          LMT_EVAL_CI_FIRST: ${{ runner.temp }}/ci-1.json
        run: uv run --frozen pytest -m data --criteria-out=criteria-eval-ci.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-ci-results
          path: |
            ${{ runner.temp }}/ci-1.json
            results/ci.json
          retention-days: 90
      # The job's per-criterion record (design/internal/criteria.md §3); a cancelled run uploads none.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criteria-eval-ci
          path: criteria-eval-ci.json
          retention-days: 90
          if-no-files-found: error
