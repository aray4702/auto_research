# The gate (blueprint §5): the one required check. It passes only when the generic
# checks and every product job pass. Product jobs live in product.yml, not here.
name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generic checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -I system/gate/generic.py --base "$BASE" --head HEAD

  product:
    uses: ./.github/workflows/product.yml

  gate:
    if: always()
    needs: [generic, product]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All checks passed
        env:
          GENERIC: ${{ needs.generic.result }}
          PRODUCT: ${{ needs.product.result }}
        run: |
          echo "generic: $GENERIC, product: $PRODUCT"
          [ "$GENERIC" = success ] && [ "$PRODUCT" = success ]
