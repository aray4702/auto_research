# One entry per bundled shared library (or a family, by glob). `files` is an fnmatch glob relative to
# site-packages, where `*` also matches `/`: `av*/libx264*` takes Linux's av.libs/ and macOS's av/.dylibs/.
# A distribution's own libraries carry the distribution's licence.

