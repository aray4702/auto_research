# sounddevice 0.5.6: PortAudio, on macOS only (Linux's wheel is pure Python and loads the system's libportaudio2).
# The universal2 wheel also carries Windows builds of PortAudio in the same folder: 3 plain DLLs (MIT) and 3
# `*-asio.dll` with Steinberg's ASIO SDK. A Mac never loads them, and this check reads only .so and .dylib
# files; the Owner accepted them as data files in the macOS install (#209, answer 1, 2026-10-30), as answers
# 3a and 4a on #122 accepted x264 and LAME in av.
[[licences.library]]
distribution = "sounddevice"
files = "_sounddevice_data/portaudio-binaries/libportaudio.dylib"
library = "PortAudio (V19.7.0)"
licence = "MIT"
platforms = ["macos-arm64"]
source = "https://github.com/spatialaudio/portaudio-binaries (README.md, Copyright), https://github.com/PortAudio/portaudio/blob/master/LICENSE.txt"

# soundfile 0.14.0: libsndfile, with LAME, mpg123, FLAC, Ogg, Vorbis and Opus linked in (their symbols in
# the binary).
[[licences.library]]
distribution = "soundfile"
files = "_soundfile_data/libsndfile*"
library = "libsndfile, with LAME, mpg123, FLAC, Ogg, Vorbis and Opus"
licence = "LGPL-2.1-or-later AND LGPL-2.0-or-later AND LGPL-2.1-only AND BSD-3-Clause"
platforms = ["linux-x86_64", "macos-arm64"]
source = "https://github.com/libsndfile/libsndfile/blob/master/COPYING, https://lame.sourceforge.io/license.txt, https://www.mpg123.de/ (COPYING), https://xiph.org/licenses/"

# torch 2.8.0 and torchaudio 2.8.0 (torio is part of torchaudio's wheel): the OpenMP and C++ runtimes they
# ship, and their own libraries by name, so a third-party library added to torch/lib, torchaudio/lib or
# torio/lib has no entry and fails.
[[licences.library]]
distribution = "torch"
files = "torch/lib/libgomp.so.1"
library = "GCC's OpenMP runtime"
licence = "GPL-3.0-or-later WITH GCC-exception-3.1"
platforms = ["linux-x86_64"]
source = "https://gcc.gnu.org/onlinedocs/libgomp/Library-Index.html"

