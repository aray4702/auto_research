# The product's toolchain (system/conventions.md): Python 3.11 (.python-version) and uv, with uv.lock.

# Permission rules for the roles that take the product's tools (runner.py, role_settings): `allow` reaches the
# Architect, Developer, Reviewer and Tester; `allow_write` only those of them with the Write tool.
[agents]
allow = [
  # The product's README checker, as CI runs it.
  "Bash(python3 -I .github/scripts/check_readme.py --root .)",
  # uv, the toolchain (#89): read the tree, and run only the product's own tools from disk. Never a bare
  # `uv run`, which would run any command, the denied ones included (#92). pytest and ruff only in exact
  # forms here: their arguments can write (`ruff check --fix`) or delete (`pytest --basetemp=<dir>`).
  "Bash(uv --version)", "Bash(uv tree --frozen:*)", "Bash(uv lock --check:*)",
  "Bash(uv run --frozen pytest)", "Bash(uv run --frozen pytest -q)",
  # The model tests, run locally: the pinned models are verified in this Mac's model cache, so no token or
  # network is needed (the same tests CI's test-models runs).
  "Bash(uv run --frozen pytest -m models)", "Bash(uv run --frozen pytest -m models -q)",
  "Bash(uv run --frozen ruff check)", "Bash(uv run --frozen ruff check .)",
  "Bash(uv run --frozen lmt:*)",  # writes only where -o/--out points; downloads only pinned models (#89)
  # G1-15's licence check: reads an install's site-packages and this file (#220).
  "Bash(python3 -I .github/scripts/check_licences.py:*)",
]
# Commands that change pyproject.toml, uv.lock or files the run names (#92). No ffmpeg or ffprobe here or
# above: they read and write URLs and any path, so the product's tests run them instead.
allow_write = [
  "Bash(uv lock:*)", "Bash(uv sync:*)", "Bash(uv add:*)", "Bash(uv remove:*)", "Bash(uv pip compile:*)",
  "Bash(uv run --frozen pytest:*)", "Bash(uv run --frozen ruff check:*)", "Bash(uv run --frozen ruff format:*)",
  # The licence inventory's installs (#220): the lock as a requirements file, and only its hash-pinned wheels,
  # unpacked under --target without building anything. Never a bare `uv pip install`.
  "Bash(uv export --frozen:*)", "Bash(uv pip install --no-deps --require-hashes --no-build --target:*)",
  # The product's own dataset tool: it downloads only the manifests' pinned URLs and writes only to the data
  # cache and the fixture paths (design/internal/g1-slice.md S1, #269).
  "Bash(uv run --frozen python -m lmt.eval.datasets:*)",
]

# The uv release CI's setup-uv steps and the README use. tests/test_toolchain.py and check_readme.py check both.
[uv]
version = "0.13.6"

# G1-15's licence check (.github/scripts/check_licences.py), in the test job on both platforms' installs.
[licences]
# The Owner's answer 2a on #81, project_requirements.md §7. Only the Owner adds to these lists.
# Licences a distribution's own metadata may give.
distributions = [
  "MIT", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "PSF-2.0", "ISC", "Unlicense", "HPND", "MPL-2.0",
  "MIT-0", "0BSD", "Zlib", "CC0-1.0", "MIT-CMU", "CNRI-Python",   # the Owner's answer 1a on #122
]
# Further licences a bundled shared library may carry. LGPL is accepted only as a bundled library.
bundled = [
  "LGPL-2.1-only", "LGPL-2.1-or-later", "LGPL-3.0-only", "LGPL-3.0-or-later",
  "GPL-3.0-or-later WITH GCC-exception-3.1",
  "LicenseRef-Intel-Simplified-Software-License",
  "Apache-2.0 WITH LLVM-exception",
  # The Owner's answer 2a on #122.
  "BSD-3-Clause-Open-MPI", "BSD-3-Clause-Clear", "IJG", "libpng-2.0", "libtiff", "bzip2-1.0.6", "FTL",
  "MIT-Modern-Variant", "MIT-open-group", "X11",
  # The Owner's answers 3a and 4a on #122: x264 and x265 in av, LAME in av and soundfile. A library still
  # passes only through its own [[licences.library]] entry below, so these admit those files alone.
  "GPL-2.0-or-later", "LGPL-2.0-or-later",
]

