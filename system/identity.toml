# Who the system acts as, and where its credentials live (locations only, never values).
# Protected path. Read by system/tools/post.py.

repo = "aray4702/auto_research"
owner_login = "aray4702"
# The Owner's second account: code owner of the protected paths, never used by an agent.
second_login = "sloan3165"
time_zone = "America/Los_Angeles"
# GitHub Actions: the only app whose `gate` check run branch protection accepts.
gate_app_id = 15368
roles = ["builder", "dispatcher", "architect", "coordinator", "developer", "reviewer", "tester"]

[reviewer_app]
app_id = 5320656
bot_login = "aray4702-reviewer-app[bot]"
key_keychain_service = "auto_research.reviewer-app-key"
key_keychain_account = "aray4702"
# Roles that may make the App approve: Reviewer runs, and the Dispatcher's renewals.
approvers = ["reviewer", "dispatcher"]
# Every installation token is scoped to this repo and to these permissions.
token_permissions = { pull_requests = "write", contents = "read", checks = "read" }

[escalation]
# The Owner's chat: a Discord webhook. Its URL is a secret, kept only in the keychain.
keychain_service = "auto_research.escalation-webhook"
keychain_account = "aray4702"
# The Owner's answers from Discord (system/dispatcher/relay.py): a bot reads the escalation channel and
# relays only this Discord user's answers. Its token is a secret, kept only in the keychain (same account).
# The relay is off while any of these is empty. The IDs are Discord snowflakes, not secrets.
discord_bot_keychain_service = "auto_research.discord-bot"
discord_guild_id = "1505352054854516866"
discord_channel_id = "1564434156568707112"
owner_discord_user_id = "1334397293616562197"

# Branch protection on main as recorded (system/conventions.md). The Dispatcher's daily rule audit
# compares the live settings with these; any difference is a rule breach (blueprint §4.5).
[branch_protection]
required_check = "gate"
required_check_app_id = 15368
strict = true
enforce_admins = true
required_approvals = 1
dismiss_stale_reviews = true
require_code_owner_reviews = true
allow_force_pushes = false
allow_deletions = false
