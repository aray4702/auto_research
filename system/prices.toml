# API list prices, USD per million tokens, for pricing local Claude Code usage in calibration.
# Source: https://platform.claude.com/docs/en/about-claude/pricing (checked 2026-10-27): base input,
# cache hits, and output per model; 5-minute and 1-hour cache writes are 1.25x and 2x base input
# for all four. Haiku 5.5 costs more for prompts over 100,000 tokens; it's priced here at the lower
# rate, which makes calibration err toward a higher points/$, the safe side. Update when prices change.

[models.claude-fable-5-1]
input = 10.0
output = 50.0
cache_read = 0.25

[models.claude-opus-5-5]
input = 4.0
output = 20.0
cache_read = 0.20

[models.claude-sonnet-5-5]
input = 2.0
output = 10.0
cache_read = 0.10

[models.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_read = 0.01
