# System caps (blueprint §5). Protected path: changes only by a PR the Owner merges.
# Reasons and measurements: sizing.md.

[claude]
# The system's share of the Max 20x plan's 7-day limit, in utilization points (1 point = 1 %).
weekly_points = 20
warn_at_points = 15
# Points per API-equivalent dollar at the margin, as calibrate.py measures it (#43), rounded up: from the
# window's first run reading (6 %, $1,072) to 42 % at $1,597 on 2026-10-28 = 0.0686/$ (1 point ≈ $15;
# 0.0667–0.0705 for ±1 point), and 0.074–0.078 from step 5's reading. The average, 0.026, undercounts. #202.
points_per_usd = 0.08
# Owner headroom, read from the account-wide utilization every run reports (0–1).
hold_new_runs_at_five_hour = 0.50
pause_at_seven_day = 0.90

[concurrency]
max_runs = 2
max_runs_per_role = 1

[wip]
max_open_agent_prs = 3
max_items_in_progress = 2
max_review_rounds = 3
claim_expiry_after_timeout_minutes = 15

# The Owner's override (2026-10-27, "lift the limit for today", #101; through the deadline day, "ignore
# today's daily limits", #130): until this time the per-role max_runs_per_day caps don't apply. Every other cap here still holds. It ends on its own; the builder then
# removes this table by PR.
[override]
no_daily_run_caps_until = "2026-10-29T00:00:00-07:00"

# Per-run hard caps (claude -p --max-turns / --max-budget-usd) and Dispatcher-enforced limits.
[roles.architect]
max_turns = 120
max_budget_usd = 20
timeout_minutes = 60
max_runs_per_day = 6

[roles.coordinator]
max_turns = 60
max_budget_usd = 5
timeout_minutes = 30
max_runs_per_day = 15

[roles.developer]
max_turns = 150
max_budget_usd = 15
timeout_minutes = 60
max_runs_per_day = 20

[roles.reviewer]
max_turns = 60
max_budget_usd = 6
timeout_minutes = 30
max_runs_per_day = 30

[roles.tester]
max_turns = 80
max_budget_usd = 8
timeout_minutes = 45
max_runs_per_day = 6

[roles.builder]
max_turns = 150
max_budget_usd = 15
timeout_minutes = 60
max_runs_per_day = 4

[ci]
money_usd_per_month = 0
minutes_per_month_signal = 3000
minutes_warn_at = 2400
