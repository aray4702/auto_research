# The runner's settings (blueprint §3): how and when agent runs start on this Mac.
# Protected path. After each merge the builder applies it: python3 -I system/tools/runner.py apply
# The daily check (runner.py check) treats any difference between this Mac and this file as an anomaly.

[runner]
claude = "/opt/homebrew/bin/claude"
python = "/opt/homebrew/bin/python3"
path = "/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
# <home>/system is the applied checkout of main that the schedules run; runs get worktrees beside it.
home = "~/auto_research-runs"
logs = "~/Library/Logs/auto_research"
# The Owner's CLI and dashboard, linked from the applied checkout onto the Owner's PATH.
cli = "~/.local/bin/arsys"
launchd_prefix = "com.aray4702.auto-research"
# Runs must sign in with this Claude subscription; a run that would sign in any other way is refused.
subscription = "max"
prompt = "You are the {role} of the development system in this repository. Read system/rules.md, then system/roles/{role}.md, and follow them. {task}"
# Every run: settings only from --settings, nothing prompts (anything not allowed is denied), no MCP servers.
flags = [
  "--restricted", "--strict-mcp-config", "--permission-mode", "dontAsk", "--permission-prompts", "none",
  "--no-session-persistence", "--output-format", "stream-json", "--verbose",
]

# Permission rules every role gets. A deny overrides an allow.
[common]
allow = [
  "Read", "Glob", "Grep",
  "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)", "Bash(git show:*)", "Bash(git fetch:*)",
  "Bash(git switch:*)", "Bash(git checkout:*)", "Bash(git branch:*)", "Bash(git add:*)", "Bash(git commit:*)",
  "Bash(git push:*)", "Bash(git merge:*)", "Bash(git rev-parse:*)", "Bash(git ls-files:*)", "Bash(git grep:*)",
  "Bash(python3 -I system/tools/post.py:*)", "Bash(python3 -I system/gate/generic.py:*)",
  "Bash(git range-diff:*)",  # read-only, like git diff: did a PR's own commits change, or only main (#181)
  "Bash(python3 -I system/gate/against_base.py:*)",  # a PR's tests at its head and its base (#139)
  "Bash(python3 -I -m unittest:*)",
  "Bash(date:*)", "Bash(ls:*)", "Bash(cat:*)", "Bash(head:*)", "Bash(tail:*)", "Bash(wc:*)", "Bash(grep:*)",
  "Bash(sort:*)", "Bash(diff:*)",
]
deny = [
  "Bash(git push --force:*)", "Bash(git push -f:*)", "Bash(git push --force-with-lease:*)",
  "Bash(git push origin main:*)", "Bash(git push origin HEAD:main:*)", "Bash(git reset --hard:*)",
  "Bash(gh pr merge:*)", "Bash(gh api:*)", "Bash(security:*)", "Bash(curl:*)", "WebFetch",
]

# Denial signatures (usage.denial_signature) the rules explain, each with the rule that says why not. The
# daily pass doesn't raise them as permission gaps; they still count in denials_per_day (#138).
[denials]
explained = [
  "Bash: cat << |",  # cat <<'EOF' | post.py: denied though both are allowed; rules.md, Posting, gives the heredoc form
]

# Per role. product_tools adds the allow list in the product's toolchain.toml, once the product has one.
[roles.architect]
model = "claude-opus-5-5"
effort = "high"
tools = ["Read", "Glob", "Grep", "Bash", "Edit", "Write"]
allow = ["Bash(mkdir -p:*)", "Edit", "Write"]
product_tools = true  # it designs the toolchain, so it checks it (#90)

[roles.coordinator]
model = "claude-opus-5-5"
effort = "medium"
tools = ["Read", "Glob", "Grep", "Bash"]
allow = []
product_tools = false

[roles.developer]
model = "claude-opus-5-5"
effort = "high"
tools = ["Read", "Glob", "Grep", "Bash", "Edit", "Write"]
allow = ["Bash(mkdir -p:*)", "Edit", "Write"]
product_tools = true

[roles.reviewer]
model = "claude-opus-5-5"
effort = "high"
tools = ["Read", "Glob", "Grep", "Bash"]
allow = []
product_tools = true

[roles.tester]
model = "claude-opus-5-5"
effort = "medium"
tools = ["Read", "Glob", "Grep", "Bash"]
allow = []
product_tools = true

[roles.builder]
model = "claude-opus-5-5"
effort = "high"
tools = ["Read", "Glob", "Grep", "Bash", "Edit", "Write"]
allow = [
  "Bash(mkdir -p:*)",
  "Edit", "Write",
  # A :* rule matches whole words only, so each script is named. The Dispatcher only as a dry run.
  "Bash(python3 -I system/tools/runner.py:*)", "Bash(python3 -I system/tools/tracker.py:*)",
  "Bash(python3 -I system/tools/calibrate.py:*)", "Bash(python3 -I system/dispatcher/flow.py:*)",
  "Bash(python3 -I system/dispatcher/dispatch.py poll --dry-run:*)",
  "Bash(python3 -I system/dispatcher/dispatch.py reconcile --dry-run:*)",
  "Bash(gh pr view:*)", "Bash(gh pr list:*)", "Bash(gh pr checks:*)", "Bash(gh run list:*)",
  "Bash(gh run view:*)", "Bash(gh issue list:*)", "Bash(gh issue view:*)",
  "Bash(launchctl print:*)",
]
product_tools = false

# launchd jobs, enabled at blueprint §8 step 7. To stop new work, throw the kill switch (arsys pause);
# to remove the jobs, set enabled = false by PR and apply.
[schedules.dispatcher-poll]
enabled = true
interval_seconds = 120
command = ["system/dispatcher/dispatch.py", "poll"]

[schedules.dispatcher-reconcile]
enabled = true
minute = 5
command = ["system/dispatcher/dispatch.py", "reconcile"]

[schedules.dispatcher-daily]
enabled = true
# The product and system audits (audit.py), once a day: the Owner's choice, 2026-10-28 (#159).
hour = 7
minute = 30
command = ["system/dispatcher/dispatch.py", "audit"]

[schedules.builder-daily]
enabled = true
hour = 8
minute = 0
command = ["system/dispatcher/run.py", "builder", "--task", "Daily run: follow the daily run in your role file."]
