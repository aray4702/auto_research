# The model manifest (design/internal/g1-stage1.md §3, G1-12, G1-15). Every file a stage loads is pinned
# by repository, revision, SHA-256 and size; `lmt models` downloads and verifies them. Each model's
# licence, creators and model card are its attribution, which NOTICE and README.md's ## Licences give.
# The revisions are those the builder cached on the Mac (#81, 19:57 PT); the hashes and sizes were
# computed from those files (#108, 2026-10-28 22:25 PT). The ASR model's model.bin was cross-checked
# against the Hub's own SHA-256; the gated pyannote repositories weren't, as the builder's token request failed.

schema_version = 1
default_asr = "distil-large-v3"
default_live_asr = "distil-large-v3"     # lmt live's model: the offline default until G2 stage 2 pins one

[[model]]
