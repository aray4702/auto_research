# The model manifest (design/internal/g1-stage1.md §3, G1-12, G1-15). Every file a stage loads is pinned
# by repository, revision, SHA-256 and size; `lmt models` downloads and verifies them. Each model's
# licence, creators and model card are its attribution, which NOTICE and README.md's ## Licences give.
# The revisions are those the builder cached on the Mac (#81, 19:57 PT); the hashes and sizes were
# computed from those files, and the large files cross-checked against the Hub's own SHA-256.

schema_version = 1
default_asr = "distil-large-v3"

[[model]]
name = "distil-large-v3"
role = "asr"                              # asr | diarization | segmentation | embedding
repository = "Systran/faster-distil-whisper-large-v3"
revision = "c3058b475261292e64a0412df1d2681c06260fab"
licence = "MIT"
creators = "SYSTRAN, converting Hugging Face's distil-whisper/distil-large-v3"
card = "https://huggingface.co/Systran/faster-distil-whisper-large-v3"
gated = false

[[model.file]]
path = "config.json"
sha256 = "PENDING"
size = 0

